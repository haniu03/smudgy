name: Re-run Release on failure

# Makes the "spot → retry spot → on-demand" escalation self-healing: when a
# "Release" run fails (most likely a spot reclaim on the self-hosted flatpak
# runners, since the build is proven), re-run its failed jobs. Combined with the
# attempt-based `runs-on` in release.yml:
#   attempt 1 -> spot,  attempt 2 -> spot (this rerun),  attempt 3 -> on-demand.
# Capped at 3 attempts so a genuinely-broken build can't loop. Hosted-runner
# failures (Windows/macOS, e.g. a notarization flake) get the same ≤2 retries,
# which is harmless.
#
# Runs on GitHub-hosted ubuntu-latest ON PURPOSE: the recovery orchestrator must
# not depend on the same self-hosted spot infra it's trying to recover.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  actions: write # to call `gh run rerun`

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed jobs (escalates capacity on the next attempt)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Run ${{ github.event.workflow_run.id }} failed on attempt ${{ github.event.workflow_run.run_attempt }} — re-running failed jobs."
          gh run rerun ${{ github.event.workflow_run.id }} --failed --repo "${{ github.repository }}"
